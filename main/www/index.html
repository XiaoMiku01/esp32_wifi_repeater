<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Wi-Fi 中继</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --fg:#1d1f23; --muted:#6b7280; --line:#e5e7eb;
          --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; --log-bg:#0f1115; --log-fg:#d1d5db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1a1d23; --fg:#e5e7eb; --muted:#9ca3af; --line:#2a2e36; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card);
           display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); display:inline-block; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px;
         grid-template-columns: minmax(0,360px) minmax(0,1fr); }
  main > * { min-width:0; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  .card h2 { font-size:14px; margin:0 0 12px; }
  .stat { display:grid; grid-template-columns: 90px 1fr; row-gap:4px; }
  .stat span:nth-child(odd) { color:var(--muted); }
  fieldset { border:1px solid var(--line); border-radius:6px; margin:0 0 12px; padding:10px 12px; min-width:0; }
  legend { padding:0 4px; color:var(--muted); }
  label { display:block; margin:6px 0 2px; }
  input[type=text], input[type=password], input[type=number] {
    width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:4px;
    background:var(--bg); color:var(--fg); font:inherit; }
  .check { display:flex; align-items:center; gap:6px; margin-top:6px; color:var(--muted); }
  .check input { margin:0; }
  button { padding:7px 14px; border:1px solid var(--line); border-radius:4px; background:var(--card);
           color:var(--fg); font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.6; cursor:default; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #msg { margin-top:8px; min-height:1.5em; }
  #msg.ok { color:var(--ok); } #msg.bad { color:var(--bad); }
  .log-card { display:flex; flex-direction:column; min-height:520px; }
  .log-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .log-head h2 { margin:0; }
  #log { flex:1; margin:0; padding:10px; overflow:auto; background:var(--log-bg); color:var(--log-fg);
         border-radius:6px; font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;
         white-space:pre-wrap; word-break:break-all; height:0; min-height:460px; }
  #log .E { color:#f87171; } #log .W { color:#fbbf24; } #log .I { color:#86efac; }
  #log .D, #log .V { color:#9ca3af; }
  .muted { color:var(--muted); font-size:12px; }
  .ssid-row { display:flex; gap:6px; }
  .ssid-row input { flex:1; min-width:0; width:auto; }
  .ssid-row button { padding:6px 10px; white-space:nowrap; }
  #scanList { list-style:none; margin:6px 0 0; padding:0; max-height:220px; overflow:auto;
              border:1px solid var(--line); border-radius:4px; }
  #scanList:empty { display:none; }
  #scanList li { display:flex; align-items:center; gap:8px; padding:6px 8px; cursor:pointer;
                 border-bottom:1px solid var(--line); }
  #scanList li:last-child { border-bottom:none; }
  #scanList li:hover, #scanList li.sel { background:var(--bg); }
  #scanList .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #scanList .meta { color:var(--muted); font-size:12px; white-space:nowrap; }
  .bars { display:inline-flex; align-items:flex-end; gap:2px; height:14px; }
  .bars i { width:3px; background:var(--line); border-radius:1px; }
  .bars i.on { background:var(--accent); }
  .bars i:nth-child(1){height:25%} .bars i:nth-child(2){height:50%}
  .bars i:nth-child(3){height:75%} .bars i:nth-child(4){height:100%}
</style>
</head>
<body>
<header>
  <h1>ESP32 Wi-Fi 中继</h1>
  <span class="dot" id="upDot"></span><span id="upText" class="muted">读取中…</span>
</header>

<main>
  <div style="display:grid; grid-template-columns:minmax(0,1fr); gap:16px; align-content:start">
    <section class="card">
      <h2>运行状态</h2>
      <div class="stat">
        <span>上游</span><span id="sUp">-</span>
        <span>STA IP</span><span id="sIp">-</span>
        <span>网关</span><span id="sGw">-</span>
        <span>信号</span><span id="sRssi">-</span>
        <span>信道</span><span id="sCh">-</span>
        <span>AP IP</span><span id="sAp">-</span>
        <span>客户端</span><span id="sCli">-</span>
        <span>运行时间</span><span id="sUp2">-</span>
        <span>空闲内存</span><span id="sHeap">-</span>
      </div>
    </section>

    <section class="card">
      <h2>配置</h2>
      <form id="cfg" autocomplete="off">
        <fieldset>
          <legend>上游路由器（STA）</legend>
          <label for="sta_ssid">SSID</label>
          <div class="ssid-row">
            <input type="text" id="sta_ssid" name="sta_ssid" maxlength="32" required>
            <button type="button" id="scanBtn">扫描</button>
          </div>
          <ul id="scanList"></ul>
          <div id="scanMsg" class="muted"></div>
          <label for="sta_pass">密码</label>
          <input type="password" id="sta_pass" name="sta_pass" maxlength="64">
          <label class="check"><input type="checkbox" id="sta_open">开放网络（无密码）</label>
        </fieldset>
        <fieldset>
          <legend>本机热点（AP）</legend>
          <label for="ap_ssid">SSID</label>
          <input type="text" id="ap_ssid" name="ap_ssid" maxlength="32" required>
          <label for="ap_pass">密码（8-63 位）</label>
          <input type="password" id="ap_pass" name="ap_pass" maxlength="63">
          <label class="check"><input type="checkbox" id="ap_open">开放网络（无密码）</label>
          <label for="ap_max_conn">最大客户端数（1-15）</label>
          <input type="number" id="ap_max_conn" name="ap_max_conn" min="1" max="15" required>
        </fieldset>
        <div class="row">
          <button type="submit" class="primary" id="saveBtn">保存并应用</button>
          <button type="button" id="restartBtn">重启设备</button>
        </div>
        <div id="msg"></div>
        <p class="muted">修改本机热点后，已连接的设备会断开，需要用新 SSID/密码重新连接。</p>
      </form>
    </section>
  </div>

  <section class="card log-card">
    <div class="log-head">
      <h2>实时日志 <span class="dot" id="wsDot"></span></h2>
      <div class="row">
        <label class="check" style="margin:0"><input type="checkbox" id="autoScroll" checked>自动滚动</label>
        <button type="button" id="pauseBtn">暂停</button>
        <button type="button" id="clearBtn">清空</button>
      </div>
    </div>
    <pre id="log"></pre>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

/* ---------- 状态 ---------- */
function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
        m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (d ? d + '天 ' : '') + [h, m, sec].map(v => String(v).padStart(2, '0')).join(':');
}
async function refreshStatus() {
  try {
    const s = await (await fetch('/api/status', { cache: 'no-store' })).json();
    const up = s.sta_connected;
    $('upDot').className = 'dot ' + (up ? 'ok' : 'bad');
    $('upText').textContent = up ? '上游已连接' : '上游未连接';
    $('sUp').textContent = up ? '已连接' : '未连接';
    $('sIp').textContent = up ? s.sta_ip : '-';
    $('sGw').textContent = up ? s.sta_gw : '-';
    $('sRssi').textContent = up ? s.rssi + ' dBm' : '-';
    $('sCh').textContent = s.channel || '-';
    $('sAp').textContent = s.ap_ip;
    $('sCli').textContent = s.clients;
    $('sUp2').textContent = fmtUptime(s.uptime);
    $('sHeap').textContent = (s.free_heap / 1024).toFixed(1) + ' KB';
  } catch (e) {
    $('upDot').className = 'dot bad';
    $('upText').textContent = '设备无响应';
  }
}
setInterval(refreshStatus, 2000);
refreshStatus();

/* ---------- 配置 ---------- */
function bindOpen(boxId, passId, hasPass) {
  const box = $(boxId), pass = $(passId);
  box.checked = !hasPass;
  const sync = () => { pass.disabled = box.checked; if (box.checked) pass.value = ''; };
  box.onchange = sync; sync();
  pass.placeholder = hasPass ? '已设置，留空表示不修改' : '';
}
async function loadConfig() {
  const c = await (await fetch('/api/config', { cache: 'no-store' })).json();
  $('sta_ssid').value = c.sta_ssid;
  $('ap_ssid').value = c.ap_ssid;
  $('ap_max_conn').value = c.ap_max_conn;
  bindOpen('sta_open', 'sta_pass', c.sta_has_pass);
  bindOpen('ap_open', 'ap_pass', c.ap_has_pass);
}
function showMsg(text, ok) { const m = $('msg'); m.textContent = text; m.className = ok ? 'ok' : 'bad'; }

$('cfg').onsubmit = async ev => {
  ev.preventDefault();
  const apPass = $('ap_pass').value;
  if (apPass && (apPass.length < 8 || apPass.length > 63)) { showMsg('AP 密码需为 8-63 位', false); return; }
  const body = new URLSearchParams();
  body.set('sta_ssid', $('sta_ssid').value);
  body.set('sta_pass', $('sta_pass').value);
  body.set('sta_open', $('sta_open').checked ? '1' : '0');
  body.set('ap_ssid', $('ap_ssid').value);
  body.set('ap_pass', apPass);
  body.set('ap_open', $('ap_open').checked ? '1' : '0');
  body.set('ap_max_conn', $('ap_max_conn').value);
  $('saveBtn').disabled = true;
  try {
    const r = await fetch('/api/config', { method: 'POST', body });
    const j = await r.json();
    if (j.ok) {
      showMsg('已保存，正在应用…', true);
      $('sta_pass').value = ''; $('ap_pass').value = '';
      setTimeout(() => loadConfig().catch(() => {}), 1500);
    } else {
      showMsg(j.error || '保存失败', false);
    }
  } catch (e) {
    showMsg('请求失败：' + e, false);
  } finally {
    $('saveBtn').disabled = false;
  }
};

$('restartBtn').onclick = async () => {
  if (!confirm('确定重启设备？')) return;
  try { await fetch('/api/restart', { method: 'POST' }); showMsg('设备正在重启…', true); }
  catch (e) { showMsg('请求失败：' + e, false); }
};

/* ---------- 扫描上游 ---------- */
function rssiLevel(r) { return r >= -55 ? 4 : r >= -67 ? 3 : r >= -78 ? 2 : 1; }
function renderScan(aps) {
  const ul = $('scanList');
  ul.textContent = '';
  for (const ap of aps) {
    const li = document.createElement('li');
    const lv = rssiLevel(ap.rssi);
    const bars = document.createElement('span');
    bars.className = 'bars';
    bars.title = ap.rssi + ' dBm';
    for (let i = 1; i <= 4; i++) { const b = document.createElement('i'); if (i <= lv) b.className = 'on'; bars.appendChild(b); }
    const name = document.createElement('span'); name.className = 'name'; name.textContent = ap.ssid;
    const meta = document.createElement('span'); meta.className = 'meta';
    meta.textContent = `${ap.rssi} dBm · 信道 ${ap.channel}${ap.open ? ' · 开放' : ' · 🔒'}`;
    li.append(bars, name, meta);
    if (ap.ssid === $('sta_ssid').value) li.className = 'sel';
    li.onclick = () => {
      $('sta_ssid').value = ap.ssid;
      [...ul.children].forEach(x => x.className = '');
      li.className = 'sel';
      $('sta_open').checked = ap.open;
      $('sta_open').onchange && $('sta_open').onchange();
      if (!ap.open) { $('sta_pass').placeholder = '输入密码'; $('sta_pass').focus(); }
    };
    ul.appendChild(li);
  }
}
async function scan() {
  const btn = $('scanBtn');
  btn.disabled = true; btn.textContent = '扫描中…';
  $('scanMsg').textContent = '';
  try {
    const j = await (await fetch('/api/scan', { cache: 'no-store' })).json();
    if (!j.ok) throw new Error(j.error);
    renderScan(j.aps);
    $('scanMsg').textContent = j.aps.length ? `找到 ${j.aps.length} 个网络，点击选择` : '未找到网络';
  } catch (e) {
    $('scanMsg').textContent = '扫描失败：' + (e.message || e);
  } finally {
    btn.disabled = false; btn.textContent = '扫描';
  }
}
$('scanBtn').onclick = scan;

loadConfig().catch(() => showMsg('读取配置失败', false)).then(scan);

/* ---------- 实时日志 ---------- */
const logEl = $('log');
const MAX_LINES = 2000;
let paused = false, pending = [], partial = '', decoder = new TextDecoder('utf-8');

function levelOf(line) {
  const m = /^(?:\x1b\[[0-9;]*m)?([EWIDV]) \(/.exec(line);
  return m ? m[1] : '';
}
function appendLines(lines) {
  const frag = document.createDocumentFragment();
  for (const raw of lines) {
    const line = raw.replace(/\x1b\[[0-9;]*m/g, '');
    const div = document.createElement('div');
    const lv = levelOf(line);
    if (lv) div.className = lv;
    div.textContent = line;
    frag.appendChild(div);
  }
  logEl.appendChild(frag);
  while (logEl.childElementCount > MAX_LINES) logEl.firstElementChild.remove();
  if ($('autoScroll').checked) logEl.scrollTop = logEl.scrollHeight;
}
function onText(text) {
  partial += text;
  const parts = partial.split(/\r?\n/);
  partial = parts.pop();
  if (!parts.length) return;
  if (paused) { pending.push(...parts); if (pending.length > MAX_LINES) pending.splice(0, pending.length - MAX_LINES); }
  else appendLines(parts);
}

function connectWs() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { $('wsDot').className = 'dot ok'; logEl.textContent = ''; partial = ''; decoder = new TextDecoder('utf-8'); };
  ws.onmessage = ev => onText(typeof ev.data === 'string' ? ev.data : decoder.decode(ev.data, { stream: true }));
  ws.onclose = () => { $('wsDot').className = 'dot bad'; setTimeout(connectWs, 2000); };
  ws.onerror = () => ws.close();
}
connectWs();

$('pauseBtn').onclick = () => {
  paused = !paused;
  $('pauseBtn').textContent = paused ? '继续' : '暂停';
  if (!paused && pending.length) { appendLines(pending); pending = []; }
};
$('clearBtn').onclick = () => { logEl.textContent = ''; pending = []; };
</script>
</body>
</html>
